name: Generate Viral Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic. Leave empty for autonomous trend discovery."
        required: false
        type: string
  schedule:
    - cron: "17 */6 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ secrets.ELEVENLABS_MODEL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.topic }}" ]; then
            python main.py --topic "${{ inputs.topic }}"
          else
            python main.py --autopilot
          fi
      - name: Upload final video only
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_number }}
          path: output/**/final.mp4
          if-no-files-found: error
          retention-days: 7
